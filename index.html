<!doctype html>
<html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Žvaigždutės">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Super žvaigždžių lentelė</title>
<style>
:root{--bg:#eaf6ee;--card:#fff;--tx:#153a2c;--mut:#5d7f70;--acc:#1f9d6b;--sun:#ffc83d;--bad:#ef5a4c;--line:#d3e6da;--onsun:#3a2a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f19;--card:#17302a;--tx:#e6f5ec;--mut:#8fb3a2;--acc:#3ccf91;--sun:#ffd25e;--bad:#ff7b6e;--line:#25443a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1f19;--card:#17302a;--tx:#e6f5ec;--mut:#8fb3a2;--acc:#3ccf91;--sun:#ffd25e;--bad:#ff7b6e;--line:#25443a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.hero input{font:800 24px/1.1 inherit;font-family:inherit;border:0;background:transparent;color:var(--tx);width:100%;padding:0}
.sub{color:var(--mut);font-size:14px}
.lvl{font-size:20px;font-weight:800;margin:8px 0 6px}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:9px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:8px 2px}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px;color:var(--mut)}
.stats .bank{background:var(--sun);color:var(--onsun)}.stats .bank span{color:var(--onsun)}
.stats input{width:100%;text-align:center;font:700 20px inherit;font-family:inherit;border:0;background:transparent;color:var(--tx);padding:0}
select,.row input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
select{width:100%;margin:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.days button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 0;font:inherit;font-size:12px;line-height:1.2}
.days button b{display:block;font-size:16px}
.days button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;margin:0 0 7px;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;text-align:left}
button.it.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
button.it.on.oops{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
button.it.on.rew{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.nm{flex:1;min-width:0}.pt{font-weight:800;color:var(--mut)}.ck{width:28px;text-align:center;font-size:20px}
.st{flex-basis:100%;font-size:13px;color:var(--mut)}.st.yes{color:var(--acc);font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;padding:4px 2px}
.moods{display:flex;gap:8px}.moods button{flex:1;font-size:26px;padding:8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.moods button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.row input{flex:1;min-width:0}.row input.num{flex:0 0 64px}
.x,.add,.act{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px}
.add{width:100%;border-style:dashed;color:var(--mut)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center}
.bottom .act{flex:1;max-width:250px;font-weight:700}
.act.go{background:var(--acc);color:#fff;border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
const DAYS=["Pir","Antr","Treč","Ketv","Penkt","Šešt","Sekm"],MOODS=["🤩","🙂","😐","🙁"],KEY="superStarChart.lt1";
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monday=(d=new Date())=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
const G=(t,p)=>({id:uid(),t,p});
function def(){const rew=[G("📺 30 min. animacinių filmukų",10),G("🍬 Vienas saldainis",3),G("🎮 30 min. žaidimų / planšetės",10),G("🍦 Ledai",8),G("🍕 Išsirinkti vakarienę",15),G("🛝 Žaidimų aikštelė",15),G("🌙 15 min. vėliau eiti miegoti",8),G("🍿 Šeimos kino vakaras",25),G("🦖 Mažas dinozauro žaislas",60),G("🎁 (savas prizas)",10)];
return{name:"Super vaikas",week:monday(),saved:0,goal:rew[8].id,mood:{},t:{},rew,
good:[G("🛏️ Pasikloti lovą",1),G("🪥 Išsivalyti dantis (rytą)",1),G("🪥 Išsivalyti dantis (vakare)",1),G("👕 Pačiam apsirengti",1),G("🙏 Pasakyti „prašau“ ir „ačiū“",1),G("🍽️ Gražiai pavalgyti vakarienę",1),G("🧸 Sutvarkyti žaislus",2),G("🧹 Padėti namų ruošoje",2),G("📚 Skaityti / namų darbai",3),G("👂 Paklausyti iš pirmo karto",3),G("🤝 Pasidalyti su broliu",3),G("💙 Būti geram broliui",5),G("🩹 Atsiprašyti ir ištaisyti",2),G("⭐ (sava idėja)",1)],
oops:[G("👊 Mušti / skaudinti brolį",-3),G("😡 Rėkti / piktžodžiauti",-2),G("🙉 Neklausyti (3 priminimai)",-2),G("🤥 Meluoti",-2),G("😭 Didelė isterija",-1),G("⚠️ (sava taisyklė)",-1)],
lv:[{f:0,t:"🥚 Mažas dinozauro kiaušinis"},{f:40,t:"🦎 Mažasis plėšrūnas"},{f:80,t:"🦕 Galingasis triceratopsas"},{f:120,t:"🦖 T-REX ČEMPIONAS"}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.good)S=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let day=(()=>{const d=Math.round((new Date(monday()+"T12:00")-new Date(S.week+"T12:00"))/864e5);const t=(new Date().getDay()+6)%7;return d===0?t:0})();
let edit=false,confirmNew=false;
function calc(){const r={sc:[],sp:[],g:0,o:0,bk:[]};let cum=+S.saved||0;
for(let d=0;d<7;d++){const f=l=>l.reduce((a,i)=>a+(S.t[i.id+":"+d]?+i.p:0),0);const g=f(S.good),o=f(S.oops),sc=Math.max(0,g+o),sp=f(S.rew);cum+=sc-sp;r.sc.push(sc);r.sp.push(sp);r.g+=g;r.o+=o;r.bk.push(cum)}
r.week=r.sc.reduce((a,b)=>a+b,0);r.spent=r.sp.reduce((a,b)=>a+b,0);r.bank=cum;return r}
const dateOf=d=>{const x=new Date(S.week+"T12:00");x.setDate(x.getDate()+d);return x};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",1800)}
function rows(list,kind,c){const sym={good:"✅",oops:"😬",rew:"🎁"}[kind];
return list.map(i=>{
if(edit)return `<div class="row"><input data-f="item" data-l="${kind}" data-i="${i.id}" data-p="t" value="${esc(i.t)}"><input class="num" type="number" inputmode="numeric" data-f="item" data-l="${kind}" data-i="${i.id}" data-p="p" value="${i.p}"><button class="x" data-a="del" data-l="${kind}" data-i="${i.id}">✕</button></div>`;
const on=S.t[i.id+":"+day],n=DAYS.reduce((a,_,d)=>a+(S.t[i.id+":"+d]?1:0),0);
let st="";if(kind==="rew"){const ok=c.bank>=i.p;st=`<span class="st ${ok?"yes":""}">${ok?"🎉 TAIP! Gali gauti":"Trūksta "+(i.p-c.bank)}</span>`}
return `<button class="row it ${on?"on "+kind:""}" data-a="tog" data-k="${kind}" data-i="${i.id}"><span class="nm">${esc(i.t)}${n>1?` <span class="sub">×${n} šią savaitę</span>`:""}</span><span class="pt">${kind==="good"&&i.p>0?"+":""}${i.p}</span><span class="ck">${on?sym:""}</span>${st}</button>`}).join("")
+(edit?`<button class="add" data-a="add" data-l="${kind}">＋ Pridėti</button>`:"")}
function render(){
const c=calc(),lv=[...S.lv].sort((a,b)=>a.f-b.f);let cur=lv[0],nx=null;
lv.forEach((l,i)=>{if(c.week>=l.f){cur=l;nx=lv[i+1]||null}});
const pr=nx?Math.min(100,(c.week-cur.f)/(nx.f-cur.f)*100):100;
const goal=S.rew.find(r=>r.id===S.goal),gp=goal?Math.min(100,Math.max(0,c.bank/goal.p*100)):0;
const wk=dateOf(0).toLocaleDateString("lt-LT",{day:"numeric",month:"short",year:"numeric"});
document.getElementById("app").innerHTML=`
<div class="card hero"><input data-f="name" value="${esc(S.name)}" aria-label="Herojaus vardas"><div class="sub">🦸 Savaitė nuo ${wk}</div>
<div class="lvl">${esc(cur.t)}</div><div class="bar"><i style="width:${pr}%"></i></div>
<div class="sub" style="margin-top:4px">${nx?`Iki „${esc(nx.t)}“ trūksta ${nx.f-c.week} sav. taškų`:"Pasiektas aukščiausias lygis!"}</div>
<div class="stats"><div><input type="number" inputmode="numeric" data-f="saved" value="${S.saved}" aria-label="Perkelta iš praėjusios savaitės"><span>🎒 Perkelta</span></div><div><b>${c.g}</b><span>🌟 Geri</span></div><div><b>${c.o}</b><span>😬 Ups</span></div><div><b>${c.spent}</b><span>🎁 Išleista</span></div><div class="bank"><b>${c.bank}</b><span>💰 Bankas</span></div></div>
<div style="margin-top:12px" class="sub">🎯 Taupau:</div><select data-f="goal">${S.rew.map(r=>`<option value="${r.id}" ${r.id===S.goal?"selected":""}>${esc(r.t)} (${r.p})</option>`).join("")}</select>
<div class="bar"><i style="width:${gp}%"></i></div></div>
<div class="days">${DAYS.map((n,d)=>`<button class="${d===day?"sel":""}" data-a="day" data-d="${d}">${n}<b>${dateOf(d).getDate()}</b>${c.bk[d]}💰</button>`).join("")}</div>
<div class="card"><h2>🌈 Geri darbai <span class="sub">paspausk, kai padaryta</span></h2>${rows(S.good,"good",c)}<div class="tot"><span>🌟 Geri taškai šiandien</span><span>${S.good.reduce((a,i)=>a+(S.t[i.id+":"+day]?+i.p:0),0)}</span></div></div>
<div class="card"><h2>😬 Ups! <span class="sub">maži minus taškai</span></h2>${rows(S.oops,"oops",c)}<div class="tot"><span>😬 Ups taškai šiandien</span><span>${S.oops.reduce((a,i)=>a+(S.t[i.id+":"+day]?+i.p:0),0)}</span></div></div>
<div class="card"><div class="tot" style="font-size:18px"><span>🏅 Dienos rezultatas</span><span>${c.sc[day]}</span></div><div class="sub" style="margin:0 0 10px 2px">Geri + ups, niekada žemiau 0</div>
<h2 style="margin-top:6px">😊 Kokia buvo mano diena?</h2><div class="moods">${MOODS.map(m=>`<button class="${S.mood[day]===m?"on":""}" data-a="mood" data-m="${m}">${m}</button>`).join("")}</div></div>
<div class="card"><h2>🎁 Prizų parduotuvė <span class="sub">paspausk, kad išleistum</span></h2>${rows(S.rew,"rew",c)}<div class="tot"><span>🎁 Išleista šiandien</span><span>${c.sp[day]}</span></div><div class="tot"><span>💰 Bankas dienos pabaigoje</span><span>${c.bk[day]}</span></div></div>
${edit?`<div class="card"><h2>🏆 Lygiai <span class="sub">pagal savaitės dienų rezultatų sumą</span></h2>${S.lv.map((l,k)=>`<div class="row"><input class="num" type="number" data-f="lvl" data-k="${k}" data-p="f" value="${l.f}"><input data-f="lvl" data-k="${k}" data-p="t" value="${esc(l.t)}"></div>`).join("")}</div>`:""}
<div class="bottom"><button class="act" data-a="edit">${edit?"✔ Baigta":"✏️ Redaguoti"}</button><button class="act ${confirmNew?"go":""}" data-a="newweek">${confirmNew?"Paspausk dar kartą":"🗓 Nauja savaitė"}</button></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,D=b.dataset;
if(a!=="newweek")confirmNew=false;
if(a==="day")day=+D.d;
else if(a==="tog"){const key=D.i+":"+day;if(S.t[key])delete S.t[key];else{if(D.k==="rew"){const r=S.rew.find(x=>x.id===D.i),c=calc();if(c.bk[day]<r.p){toast("Dar nepakanka taškų — trūksta "+(r.p-c.bk[day]));return}}S.t[key]=1}}
else if(a==="mood")S.mood[day]=S.mood[day]===D.m?null:D.m;
else if(a==="edit")edit=!edit;
else if(a==="del"){S[D.l]=S[D.l].filter(i=>i.id!==D.i)}
else if(a==="add"){S[D.l].push(G("⭐ Naujas",D.l==="oops"?-1:D.l==="rew"?10:1))}
else if(a==="newweek"){if(!confirmNew){confirmNew=true;render();return}
S.saved=calc().bank;const x=new Date(S.week+"T12:00");x.setDate(x.getDate()+7);S.week=x.toISOString().slice(0,10);S.t={};S.mood={};day=0;confirmNew=false;toast("Nauja savaitė — bankas perkeltas")}
save();render()});
document.addEventListener("change",e=>{const el=e.target,D=el.dataset,f=D.f;if(!f)return;
if(f==="name")S.name=el.value;
else if(f==="saved")S.saved=+el.value||0;
else if(f==="goal")S.goal=el.value;
else if(f==="item"){const it=S[D.l].find(i=>i.id===D.i);if(D.p==="p"){let v=+el.value||0;if(D.l==="oops")v=-Math.abs(v);it.p=v}else it.t=el.value}
else if(f==="lvl"){const l=S.lv[+D.k];l[D.p]=D.p==="f"?+el.value||0:el.value}
save();render()});
render();
</script></body></html>
